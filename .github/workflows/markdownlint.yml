name: markdownlint

on:
  push:
    branches: [main]
    paths:
      - "**/*.md"
      - ".github/workflows/markdownlint.yml"
  pull_request:
    branches: [main]
    paths:
      - "**/*.md"

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run markdownlint
        uses: DavidAnson/markdownlint-cli2-action@v16
        with:
          globs: |
            **/*.md
            !raw/**
            !node_modules/**
          config: |
            {
              "default": true,
              "MD013": false,
              "MD024": { "siblings_only": true },
              "MD033": false,
              "MD041": false,
              "MD046": false
            }
